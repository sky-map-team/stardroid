name: Run on the CI emulator
description: >
  android-emulator-runner with the options every connected_test step shares, so the AVD
  snapshot step and each test attempt can't drift apart.

inputs:
  api-level:
    required: true
  target:
    required: true
  emulator-build:
    required: true
  gpu:
    required: true
  script:
    required: true
  # The snapshot-generating step sets this so the booted emulator saves its snapshot.
  save-snapshot:
    default: 'false'
  disable-animations:
    default: 'true'
  # The runner reuses an existing AVD directory, so a retry after a half-failed boot sets this.
  force-avd-creation:
    default: 'false'

runs:
  using: composite
  steps:
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ inputs.api-level }}
        target: ${{ inputs.target }}
        arch: x86_64
        force-avd-creation: ${{ inputs.force-avd-creation }}
        emulator-boot-timeout: 1200
        emulator-build: ${{ inputs.emulator-build }}
        # ' ' (not ''): an empty string is falsy and would fall through to -no-snapshot-save.
        emulator-options: ${{ inputs.save-snapshot == 'true' && ' ' || '-no-snapshot-save' }} -no-window -gpu ${{ inputs.gpu }} -noaudio -no-boot-anim -camera-back none -memory 2048 -partition-size 512
        disable-animations: ${{ inputs.disable-animations }}
        profile: Nexus 6
        working-directory: ./stardroid-v2
        script: ${{ inputs.script }}

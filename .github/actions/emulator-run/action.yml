name: Run on the CI emulator
description: >
  android-emulator-runner with the options every connected_test step shares, so the test
  attempts can't drift apart.

inputs:
  api-level:
    required: true
  target:
    required: true
  emulator-build:
    required: true
  gpu:
    required: true
  script:
    required: true
  disable-animations:
    default: 'true'

runs:
  using: composite
  steps:
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ inputs.api-level }}
        target: ${{ inputs.target }}
        arch: x86_64
        emulator-boot-timeout: 1200
        emulator-build: ${{ inputs.emulator-build }}
        emulator-options: -no-snapshot-save -no-window -gpu ${{ inputs.gpu }} -noaudio -no-boot-anim -camera-back none -memory 2048 -partition-size 512
        disable-animations: ${{ inputs.disable-animations }}
        profile: Nexus 6
        working-directory: ./stardroid-v2
        script: ${{ inputs.script }}

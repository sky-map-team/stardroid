name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_unit_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./stardroid-v2

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # Fails if any shipped asset is missing from ASSET-LICENSES.txt. Runs before the
      # Gradle build so an unclassified asset is reported in seconds rather than after
      # a full check. See stardroid-v2/LICENSE.md.
      - name: Asset licence manifest
        run: python3 tools/check_asset_licenses.py
      - name: Translated format-string check
        run: python3 tools/check_format_strings.py
      - name: Build and test
        run: ./gradlew check --no-daemon
        env:
          ORG_GRADLE_PROJECT_org_gradle_java_home: ${{ env.JAVA_HOME }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: 'stardroid-v2/**/build/reports/tests/'
      - name: Android Test Report
        uses: asadmansr/android-test-report-action@v1.2.0
        if: always()

  # The shared (Kotlin Multiplatform) core's commonTest suites on the iOS simulator. The Linux
  # job above cannot build Apple targets, so without this the golden tests would only ever run on
  # the JVM — and running them on iOS is the point of sharing the core. See
  # stardroid-v2/docs/design/build-and-tooling.md.
  shared_core_ios:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./stardroid-v2

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
      # The Kotlin/Native toolchain and its LLVM (~1 GB) download on first use otherwise.
      - name: Kotlin/Native cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('stardroid-v2/gradle/libs.versions.toml') }}
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Shared core tests on the iOS simulator
        run: ./gradlew iosSimulatorArm64Test --no-daemon
        env:
          ORG_GRADLE_PROJECT_org_gradle_java_home: ${{ env.JAVA_HOME }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-results
          path: 'stardroid-v2/**/build/reports/tests/'

  connected_test:
    needs: build_and_unit_test
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: ./stardroid-v2
    env:
      # Emulator 37.2.12, pinned rather than "latest", so a new release can't change results
      # between runs.
      EMULATOR_BUILD: '16428233'
      # ANGLE over SwiftShader. On Linux, swiftshader_indirect gets the legacy SwiftShader GLES
      # translator, and the emulator died tearing down RendererPerfTest's GL surface (D140).
      EMULATOR_GPU: swangle
    strategy:
      # One API level losing its emulator shouldn't cancel the others.
      fail-fast: false
      matrix:
        api-level: [ 34, 35 ] # 35 is the highest API with a google_atd image; 34 pre-dates edge to edge.
        target: [ google_atd ]
        include:
          # minSdk floor. google_atd images start at API 30, so API 29 uses the plain `default`
          # image. Stock Android 10's system SQLite lacks the unicode61 FTS tokenizer (#1003),
          # a difference the API 34/35 images can't reveal.
          - api-level: 29
            target: default

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Hosted runners mix CPU models. Annotated so emulator losses can be checked against the
      # hardware they ran on (D140).
      - name: Runner hardware
        working-directory: ./
        run: |
          cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)
          avx512=$(grep -qw avx512f /proc/cpuinfo && echo yes || echo no)
          mem=$(free -g | awk '/^Mem:/ {print $2}')
          echo "::notice title=Runner hardware::$cpu; $(nproc) vCPUs; ${mem} GB; avx512f=$avx512"

      # The emulator refuses to start with `FATAL | Your device does not have enough
      # disk space to run avd: `test`` when the runner is tight, and the action then
      # polls a device that never appears until the step times out. Reclaiming the
      # toolchains this job never uses keeps the AVD build in space.
      # Runs before Setup Java, which installs into the hosted tool cache.
      - name: Free disk space
        working-directory: ./ # Not repo-specific
        run: |
          echo "Before:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android/sdk/ndk \
            /opt/hostedtoolcache/CodeQL || true
          echo "After:"
          df -h /

      - name: Enable KVM
        working-directory: ./ # Keep KVM at root
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true

      # A lost emulator gets up to two retries on a fresh one; a test failure doesn't.
      # run_connected_tests.sh records which it was (D140).
      - name: Run connected tests
        id: attempt1
        continue-on-error: true
        uses: ./.github/actions/emulator-run
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          emulator-build: ${{ env.EMULATOR_BUILD }}
          gpu: ${{ env.EMULATOR_GPU }}
          script: bash tools/run_connected_tests.sh 1

      # No outcome file means the emulator never came up (or the SDK download died, as it
      # does when dl.google.com has a bad spell), which is worth a retry too. The pause gives
      # such an outage time to pass; the action re-downloads the SDK on every invocation, so
      # caching it wouldn't help.
      - name: Fail on test failures, retry on a lost emulator
        if: steps.attempt1.outcome == 'failure'
        run: |
          outcome=$(cat build/ci/attempt-1/outcome 2>/dev/null || echo emulator-lost)
          if [ "$outcome" = tests-failed ]; then
            echo "::error::Connected tests failed; not retrying."
            exit 1
          fi
          echo "::warning::Attempt 1 ended without a test failure ($outcome), so retrying on a fresh emulator in 90s."
          sleep 90

      - name: Retry connected tests
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/emulator-run
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          emulator-build: ${{ env.EMULATOR_BUILD }}
          gpu: ${{ env.EMULATOR_GPU }}
          script: bash tools/run_connected_tests.sh 2

      - name: Fail on test failures, retry once more on a lost emulator
        if: steps.attempt2.outcome == 'failure'
        run: |
          outcome=$(cat build/ci/attempt-2/outcome 2>/dev/null || echo emulator-lost)
          if [ "$outcome" = tests-failed ]; then
            echo "::error::Connected tests failed; not retrying."
            exit 1
          fi
          echo "::warning::Attempt 2 ended without a test failure ($outcome), so retrying on a fresh emulator in 240s."
          sleep 240

      # No status function in `if`: the implicit success() is what skips this after the gate
      # above exits 1 on a test failure. Don't add always() here.
      - name: Retry connected tests again
        if: steps.attempt2.outcome == 'failure'
        uses: ./.github/actions/emulator-run
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          emulator-build: ${{ env.EMULATOR_BUILD }}
          gpu: ${{ env.EMULATOR_GPU }}
          script: bash tools/run_connected_tests.sh 3

      - name: Upload connected test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-test-results-${{ matrix.api-level }}
          path: stardroid-v2/build/ci/

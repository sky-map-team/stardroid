# XcodeGen spec for the iOS app (iOS port phase 4). The .xcodeproj is generated, not checked in:
#   (cd ios/SkyMap && xcodegen)
# Everything but this shell is Kotlin: the app-ios framework (SkyMapKit) and the shared modules.
name: SkyMap
options:
  bundleIdPrefix: io.penterakt.skymap
  deploymentTarget:
    iOS: "15.0"
# Shared by the app and its widget extension, whose versions must match.
settings:
  base:
    MARKETING_VERSION: "2.1.0"
    SKYMAP_RELEASE_NAME: Izzie
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # A development build has its own App Group and link scheme, so a dev install beside the App
    # Store app never reads its data or answers its links.
    Debug:
      SKYMAP_APP_GROUP: group.io.penterakt.skymap.dev
      SKYMAP_URL_SCHEME: skymap-dev
    Release:
      SKYMAP_APP_GROUP: group.io.penterakt.skymap
      SKYMAP_URL_SCHEME: skymap
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  SkyMap:
    type: application
    platform: iOS
    # The WithoutAdIdSupport variant never reads the advertising ID, so no tracking prompt.
    dependencies:
      - package: Firebase
        product: FirebaseAnalyticsWithoutAdIdSupport
      - package: Firebase
        product: FirebaseRemoteConfig
      # The home-screen and Lock Screen widgets, embedded as an app extension.
      - target: SkyMapWidgets
    sources:
      - Sources
      # The renderer's images, copied as Android packages them so the keys map to the same paths.
      - path: ../../app/src/main/assets/planets
        type: folder
        buildPhase: resources
      - path: ../../app/src/main/assets/catalog
        type: folder
        buildPhase: resources
      # The object cards' photos, read by name (rememberCelestialImage).
      - path: ../../app/src/main/assets/celestial_images
        type: folder
        buildPhase: resources
      # The warm welcome's backdrop (rememberAssetBitmap).
      - path: ../../app/src/main/assets/welcome
        type: folder
        buildPhase: resources
      # The version banner's release portrait (rememberAssetBitmap). iOS's own, not Android's:
      # the two platforms name their releases independently.
      - path: Resources/splash
        type: folder
        buildPhase: resources
      # The calibration screen's figure-eight animation (FigureEightAnimation).
      - path: ../../app/src/main/assets/calibration
        type: folder
        buildPhase: resources
      # The catalog, generated from source-data/ by the pre-build step (never checked in).
      - path: ../../data/build/generated/assets/generateCatalogDb/skymap.db
        buildPhase: resources
        optional: true
    info:
      path: Info.plist
      properties:
        # Compose Multiplatform refuses to start without it (it needs 120 Hz on ProMotion).
        CADisableMinimumFrameDurationOnPhone: true
        # A night sky: light status bar text everywhere.
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        # Android's navy OS splash, which the version banner continues from without a seam.
        UILaunchScreen:
          UIColorName: LaunchNavy
        # The version with its release name ("2.0.0:GDC"), as Android's versionName has it; the
        # short version itself must stay numeric.
        SkyMapVersionName: $(MARKETING_VERSION):$(SKYMAP_RELEASE_NAME)
        # Only HTTPS through the system, which is exempt from export-compliance documentation.
        ITSAppUsesNonExemptEncryption: false
        # Collection starts off, so an opted-out user's first events can't go before the opt-out
        # does; the shared settings turn it on (opt-in default, as on Android).
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        # The satellite data refresh (SatelliteRefreshTask); the system decides when it runs.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.penterakt.skymap.satellite-refresh]
        # The system location prompt's text. Localized with the app's strings in phase 5.
        NSLocationWhenInUseUsageDescription: >-
          Sky Map uses your location to show the sky as it looks from where you are.
        # Read by both bundles' Kotlin (WidgetSharedStore, MoonWidgets).
        SkyMapAppGroup: $(SKYMAP_APP_GROUP)
        SkyMapURLScheme: $(SKYMAP_URL_SCHEME)
        # Links to an object's card (ObjectLink), which the widgets open the app with.
        CFBundleURLTypes:
          - CFBundleURLName: io.penterakt.skymap.object
            CFBundleURLSchemes: [$(SKYMAP_URL_SCHEME)]
    # The App Group the widget extension reads the saved location from.
    entitlements:
      path: SkyMap.entitlements
      properties:
        com.apple.security.application-groups: [$(SKYMAP_APP_GROUP)]
    postCompileScripts:
      # The Firebase console's config, not checked in: one plist per registered app, so dev builds
      # report as io.penterakt.skymap.dev and never as the App Store app. Without the matching
      # file analytics stays off (see FirebaseAnalyticsAdapter); a missing file is not an error.
      - name: Bundle GoogleService-Info.plist if present
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            plist="GoogleService-Info.plist"
          else
            plist="GoogleService-Info-Dev.plist"
          fi
          if [ -f "$SRCROOT/$plist" ]; then
            cp "$SRCROOT/$plist" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
          else
            echo "warning: $plist not found; Firebase stays unconfigured for this build"
          fi
    preBuildScripts:
      - name: Build SkyMapKit and the catalog (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17)}"
          ./gradlew :data:generateCatalogDb :app-ios:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        # .dev: development builds register their bundle ID to the signing team, and bundle IDs
        # are unique across Apple, so a dev build must never claim the App Store app's ID.
        # Release builds (archives) use the App Store ID; see configs below.
        PRODUCT_BUNDLE_IDENTIFIER: io.penterakt.skymap.dev
        DEVELOPMENT_TEAM: F98KUL97FJ
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.1.1"
        SKYMAP_RELEASE_NAME: Izzie
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sky Map
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # The asset catalog holds the launch screen colour and the app icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        # iPad must support every orientation (App Store validation 90474).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../app-ios/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: -framework SkyMapKit -framework Metal -framework MetalKit
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
      configs:
        # Debug installs beside the App Store/TestFlight build, so it needs its own name.
        Debug:
          INFOPLIST_KEY_CFBundleDisplayName: Sky Map Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.penterakt.skymap
  SkyMapWidgets:
    # ios-platform-surfaces.md §6. Its own process with a tight memory limit, so it links only
    # SkyMapWidgetKit (:app-ios-widgets): the shared astronomy, with no Compose, Metal or database.
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Sky Map
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SkyMapAppGroup: $(SKYMAP_APP_GROUP)
        SkyMapURLScheme: $(SKYMAP_URL_SCHEME)
    entitlements:
      path: Widgets/SkyMapWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(SKYMAP_APP_GROUP)]
    preBuildScripts:
      - name: Build SkyMapWidgetKit and the widget strings (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17)}"
          ./gradlew :app-ios-widgets:embedAndSignAppleFrameworkForXcode :app-ios-widgets:exportWidgetStrings
    postCompileScripts:
      # Generated from the shared Android-format strings (ExportAppleStrings), never checked in,
      # so they are copied in rather than listed as sources.
      - name: Bundle the widget strings
        basedOnDependencyAnalysis: false
        script: |
          cp -R "$SRCROOT/../../app-ios-widgets/build/generated/widgetStrings/." \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.penterakt.skymap.dev.widgets
        DEVELOPMENT_TEAM: F98KUL97FJ
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../app-ios-widgets/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: -framework SkyMapWidgetKit
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
        # The development language; the generated .lproj folders add the rest.
        DEVELOPMENT_LANGUAGE: en
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.penterakt.skymap.widgets
  SkyMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: SkyMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.penterakt.skymap.dev.uitests
        DEVELOPMENT_TEAM: F98KUL97FJ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
schemes:
  SkyMap:
    run:
      # Local tips for the simulator and Xcode runs, before App Store Connect has the products.
      storeKitConfiguration: Products.storekit
    build:
      targets:
        SkyMap: all
        SkyMapUITests: [test]
    test:
      targets:
        - SkyMapUITests

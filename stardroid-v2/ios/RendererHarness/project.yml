# XcodeGen spec for the iOS renderer harness. The .xcodeproj is generated, not checked in:
#   brew install xcodegen && (cd ios/RendererHarness && xcodegen)
# See ../README.md.
name: RendererHarness
options:
  bundleIdPrefix: com.penterakt.skymap
  deploymentTarget:
    iOS: "16.0"
targets:
  RendererHarness:
    type: application
    platform: iOS
    sources:
      - Sources
    preBuildScripts:
      - name: Build SkyMapHarness (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          # Gradle builds the Kotlin framework for exactly what Xcode is building (configuration,
          # SDK, architectures) into render/metal-harness/build/xcode-frameworks.
          cd "$SRCROOT/../.."
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17)}"
          ./gradlew :render:metal-harness:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.penterakt.skymap.rendererharness
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Renderer Harness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../render/metal-harness/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: -framework SkyMapHarness -framework Metal -framework MetalKit
        # The build phase runs Gradle, which reads and writes outside the project directory.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"

# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# Per-module R classes don't transitively include upstream resources: faster builds, no
# resource namespace pollution. Recommended for multi-module projects.
android.nonTransitiveRClass=true
kotlin.code.style=official

# gms and fdroid share one applicationId (app/build.gradle.kts) by design - it's the same
# Play Store listing, not two apps. AGP 9.0's new uniqueness check would fail that build, so
# opt out instead of assigning the flavors distinct application IDs.
android.uniquePackageNames=false
# KSP's Gradle plugin still registers its generated source dirs via the kotlin.sourceSets
# DSL, which AGP 9's built-in Kotlin rejects by default (google/ksp#2729, open upstream as of
# ksp 2.2.10-2.0.2). AGP's own error for this points at this exact suppression.
android.disallowKotlinSourceSets=false
